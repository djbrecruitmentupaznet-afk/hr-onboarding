<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalender Review - HR System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { primary: '#4F46E5', secondary: '#10B981' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .sidebar-transition { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

    <!-- LAYAR LOGIN -->
    <div id="login-view" class="hidden min-h-screen flex items-center justify-center p-4 bg-slate-900 relative overflow-hidden">
        <div class="absolute inset-0 bg-indigo-900/20"></div>
        <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden relative z-10 border border-slate-100">
            <div class="p-8 pb-6 text-center bg-slate-50 border-b border-slate-100">
                <div class="w-16 h-16 bg-indigo-600 rounded-2xl mx-auto flex items-center justify-center shadow-lg shadow-indigo-500/30 mb-4">
                    <i class="fa-solid fa-calendar-days text-2xl text-white"></i>
                </div>
                <h1 class="text-2xl font-black text-slate-800 tracking-tight">HR Onboarding</h1>
                <p class="text-sm text-slate-500 mt-1 font-medium">Kalender Review Karyawan</p>
            </div>
            <div class="p-8 pt-6">
                <form id="form-login" onsubmit="handleLogin(event)" class="space-y-5">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wider">Email Akun HR</label>
                        <div class="relative">
                            <i class="fa-solid fa-envelope absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                            <input type="email" id="login-email" required class="w-full text-sm rounded-xl border border-slate-300 pl-11 pr-4 py-3 bg-slate-50/50 outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all font-medium" placeholder="admin@perusahaan.com">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wider">Kata Sandi</label>
                        <div class="relative">
                            <i class="fa-solid fa-lock absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                            <input type="password" id="login-pass" required class="w-full text-sm rounded-xl border border-slate-300 pl-11 pr-4 py-3 bg-slate-50/50 outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all font-medium" placeholder="••••••••">
                        </div>
                    </div>
                    <button type="submit" id="btn-login" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-indigo-500/30 transition-all mt-2 active:scale-[0.98]">
                        Masuk Sistem
                    </button>
                </form>
            </div>
        </div>
    </div>
    <!-- AKHIR LAYAR LOGIN -->

    <!-- APLIKASI UTAMA (Disembunyikan sampai Login) -->
    <div id="app-view" class="hidden min-h-screen w-full">
        <!-- Sidebar / Drawer -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-slate-900 text-white transform -translate-x-full sidebar-transition shadow-2xl flex flex-col">
            <div class="h-16 flex items-center px-6 border-b border-slate-800 gap-3">
                <div class="bg-indigo-500 text-white p-1.5 rounded-lg">
                    <i class="fa-solid fa-users-gear text-sm"></i>
                </div>
                <span class="font-bold text-lg tracking-tight">HR Onboarding</span>
            </div>
            <div class="py-6 px-4 flex-grow flex flex-col gap-2">
                <p class="px-2 text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Menu Utama</p>
                <!-- Navigasi disesuaikan per halaman -->
                <button onclick="window.location.href='index.html'" id="menu-btn-dashboard" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition-colors">
                    <i class="fa-solid fa-gauge-high w-5 text-center"></i> Monitoring Onboarding
                </button>
                <button onclick="window.location.href='reviewprob.html'" id="menu-btn-calendar" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-colors bg-indigo-600 text-white">
                    <i class="fa-solid fa-calendar-days w-5 text-center"></i> Tanggal Review
                </button>
                <button onclick="window.location.href='admin.html'" id="menu-btn-admin" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition-colors">
                    <i class="fa-solid fa-gear w-5 text-center"></i> Pengaturan Admin
                </button>
            </div>
            <div class="p-4 border-t border-slate-800 text-xs text-slate-500 text-center">
                v2.0 &copy; 2026 HR Dept
            </div>
        </aside>

        <!-- Overlay for sidebar on mobile -->
        <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-30 hidden opacity-0 transition-opacity"></div>

        <!-- Main Content Wrapper -->
        <div class="flex-grow flex flex-col min-h-screen w-full transition-all duration-300">
            
            <!-- Top Navbar -->
            <nav class="bg-white border-b border-gray-200 sticky top-0 z-20 shadow-sm">
                <div class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8">
                    <div class="flex justify-between h-16 items-center">
                        <div class="flex items-center gap-4">
                            <button onclick="toggleSidebar()" class="text-gray-500 hover:text-indigo-600 focus:outline-none p-2 rounded-lg hover:bg-slate-100 transition-colors">
                                <i class="fa-solid fa-bars text-xl"></i>
                            </button>
                            <h1 id="topbar-title" class="font-bold text-lg text-gray-900 hidden sm:block">Kalender Review</h1>
                        </div>
                        <div class="flex items-center gap-4">
                            <button class="text-gray-500 hover:text-gray-700 transition-colors relative mr-2">
                                <i class="fa-solid fa-bell"></i>
                                <span class="absolute -top-1 -right-1 bg-red-500 w-2 h-2 rounded-full"></span>
                            </button>
                            <div class="h-8 w-8 rounded-full bg-indigo-100 flex items-center justify-center border border-indigo-200">
                                <span class="text-indigo-700 font-bold text-sm">HR</span>
                            </div>
                            <!-- Tombol Keluar (Logout) -->
                            <button onclick="handleLogout()" class="flex items-center gap-2 text-xs font-bold text-red-600 bg-red-50 hover:bg-red-100 border border-red-200 px-3 py-1.5 rounded-lg transition-colors shadow-sm ml-2">
                                <i class="fa-solid fa-right-from-bracket"></i> <span class="hidden sm:inline">Keluar</span>
                            </button>
                        </div>
                    </div>
                </div>
            </nav>

            <!-- View: Calendar / Reminder -->
            <main id="calendar-view" class="flex-grow max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full block">
                <div class="mb-8 flex flex-col md:flex-row md:items-end justify-between gap-4">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-900">Kalender Review Kinerja</h2>
                        <p class="text-sm text-gray-500 mt-1">Jadwal review bulanan karyawan dalam tampilan kalender.</p>
                    </div>
                    <div class="flex items-center gap-4 bg-white px-4 py-2 rounded-xl border border-gray-200 shadow-sm">
                        <button onclick="changeCalMonth(-1)" class="text-gray-500 hover:text-indigo-600 p-2 rounded-lg hover:bg-slate-50 transition-colors"><i class="fa-solid fa-chevron-left"></i></button>
                        <h3 id="calendar-month-year" class="font-bold text-gray-800 min-w-[130px] text-center text-sm uppercase tracking-wide">Bulan Tahun</h3>
                        <button onclick="changeCalMonth(1)" class="text-gray-500 hover:text-indigo-600 p-2 rounded-lg hover:bg-slate-50 transition-colors"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="grid grid-cols-7 bg-slate-50/80 border-b border-gray-200">
                        <div class="p-3 text-center text-xs font-bold text-gray-500 uppercase tracking-wider">Sen</div>
                        <div class="p-3 text-center text-xs font-bold text-gray-500 uppercase tracking-wider">Sel</div>
                        <div class="p-3 text-center text-xs font-bold text-gray-500 uppercase tracking-wider">Rab</div>
                        <div class="p-3 text-center text-xs font-bold text-gray-500 uppercase tracking-wider">Kam</div>
                        <div class="p-3 text-center text-xs font-bold text-gray-500 uppercase tracking-wider">Jum</div>
                        <div class="p-3 text-center text-xs font-bold text-indigo-500 uppercase tracking-wider">Sab</div>
                        <div class="p-3 text-center text-xs font-bold text-red-500 uppercase tracking-wider">Min</div>
                    </div>
                    <div id="calendar-grid" class="grid grid-cols-7 auto-rows-[minmax(120px,auto)]">
                        <!-- Hari-hari akan dirender oleh JS -->
                    </div>
                </div>
            </main>

        </div> <!-- End Main Content -->
    </div> <!-- END APLIKASI UTAMA -->

    <!-- Notification Toast -->
    <div id="notification" class="fixed bottom-6 right-6 max-w-sm bg-gray-900 text-white px-4 py-3 rounded-xl shadow-2xl flex items-start gap-3 transform translate-y-20 opacity-0 transition-all duration-300 z-[70] border border-gray-700">
        <i class="fa-solid fa-circle-check text-green-400 mt-1"></i>
        <div>
            <p class="text-sm font-bold text-white">Notifikasi</p>
            <p id="notification-text" class="text-xs text-gray-300 mt-0.5">Pesan</p>
        </div>
    </div>

    <!-- FIREBASE LIBRARIES -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>

    <script>
        // --- KONFIGURASI FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyCobEgxTnMagQj6c8YsfiQtwk6zkvPaq-w",
            authDomain: "hr-onboarding-app-76582.firebaseapp.com",
            projectId: "hr-onboarding-app-76582",
            storageBucket: "hr-onboarding-app-76582.firebasestorage.app",
            messagingSenderId: "594601397871",
            appId: "1:594601397871:web:6af5c22a9c964201d5079a"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        // ----------------------------

        // --- SISTEM LOGIN (AUTHENTICATION) ---
        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('app-view').classList.remove('hidden');
                document.getElementById('app-view').classList.add('flex');
                loadDataFromFirebase();
            } else {
                document.getElementById('login-view').classList.remove('hidden');
                document.getElementById('app-view').classList.add('hidden');
                document.getElementById('app-view').classList.remove('flex');
                document.getElementById('calendar-grid').innerHTML = '';
            }
        });

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            const btn = document.getElementById('btn-login');
            
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memeriksa...';
            btn.disabled = true;

            auth.signInWithEmailAndPassword(email, pass)
                .then(() => {
                    btn.innerHTML = 'Masuk Sistem';
                    btn.disabled = false;
                    document.getElementById('form-login').reset();
                    showNotification("Berhasil Login!");
                })
                .catch((error) => {
                    btn.innerHTML = 'Masuk Sistem';
                    btn.disabled = false;
                    alert("Gagal Login! Pastikan Email dan Kata Sandi benar.");
                    console.error(error);
                });
        }

        function handleLogout() {
            auth.signOut().then(() => showNotification("Berhasil Keluar Sistem."));
        }
        // ------------------------------------

        // Template Review Base untuk filtering calendar[cite: 1]
        let baseReviewChecklistTemplate = [
            { id: 'review1', label: 'Review Bulan 1', type: 'review' },
            { id: 'review2', label: 'Review Bulan 2', type: 'review' },
            { id: 'review3', label: 'Review Bulan 3 (Final)', type: 'review' }
        ];

        let employees = [];
        let currentCalDate = new Date(); 

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }

        function showNotification(msg) {
            const notif = document.getElementById('notification');
            document.getElementById('notification-text').innerText = msg;
            notif.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => notif.classList.add('translate-y-20', 'opacity-0'), 3000);
        }

        async function loadDataFromFirebase() {
            try {
                const snapshot = await db.collection("employees").get();
                employees = snapshot.docs.map(doc => {
                    let data = doc.data();
                    data.id = doc.id; 
                    return data;
                });
                renderCalendar();
            } catch (error) {
                console.error("Error mengambil data:", error);
                showNotification("Gagal memuat data dari Database!");
            }
        }

        function getEmployeeTemplates(emp) {
            let reviews = [...baseReviewChecklistTemplate];
            if (emp.role && emp.department && emp.role.toLowerCase() === 'staff' && emp.department.toLowerCase() === 'sales marketing') {
                reviews.unshift({ id: 'review_ojt', label: 'Review OJT', type: 'review' });
            }
            return { reviews: reviews };
        }

        function changeCalMonth(offset) {
            currentCalDate.setMonth(currentCalDate.getMonth() + offset);
            renderCalendar();
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            const monthYearText = document.getElementById('calendar-month-year');
            if (!grid || !monthYearText) return;

            grid.innerHTML = '';
            
            const year = currentCalDate.getFullYear();
            const month = currentCalDate.getMonth();
            
            const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            monthYearText.innerText = `${monthNames[month]} ${year}`;

            let firstDay = new Date(year, month, 1).getDay();
            firstDay = firstDay === 0 ? 6 : firstDay - 1; 
            
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // Mapping jadwal dari data karyawan[cite: 1]
            let remindersMap = {};
            employees.forEach(emp => {
                if (emp.isTerminated) return; // Skip terminated employees
                
                const tmpl = getEmployeeTemplates(emp).reviews;
                tmpl.forEach(t => {
                    const data = emp.checklist ? emp.checklist[t.id] : null;
                    if (data && data.scheduledDate && data.status !== 'DONE' && data.status !== 'CANCELLED') {
                        const dateStr = data.scheduledDate; 
                        if(!remindersMap[dateStr]) remindersMap[dateStr] = [];
                        remindersMap[dateStr].push({ empName: emp.name, task: t.label, status: data.status, role: emp.role });
                    }
                });
            });

            for (let i = 0; i < firstDay; i++) {
                grid.innerHTML += `<div class="p-2 border-r border-b border-gray-100 bg-gray-50/50 min-h-[120px]"></div>`;
            }

            const today = new Date();
            for (let day = 1; day <= daysInMonth; day++) {
                const currentDateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const isToday = day === today.getDate() && month === today.getMonth() && year === today.getFullYear();
                
                let eventsHtml = '';
                if(remindersMap[currentDateStr]) {
                    remindersMap[currentDateStr].forEach(rem => {
                        const isPast = new Date(currentDateStr) < new Date(today.setHours(0,0,0,0));
                        const bgClass = isPast ? 'bg-red-50 border-red-200 text-red-700' : 'bg-indigo-50 border-indigo-200 text-indigo-700';
                        const dotClass = isPast ? 'bg-red-500' : 'bg-indigo-500';
                        
                        eventsHtml += `
                            <div class="mt-1 p-1.5 border rounded-lg shadow-sm ${bgClass} text-[10px] leading-tight cursor-pointer hover:shadow transition-shadow" title="${rem.task} - ${rem.empName}" onclick="window.location.href='onboarding.html'">
                                <div class="flex items-center gap-1.5 mb-0.5">
                                    <span class="w-1.5 h-1.5 rounded-full ${dotClass}"></span>
                                    <strong class="truncate uppercase">${rem.empName}</strong>
                                </div>
                                <div class="truncate opacity-80">${rem.task}</div>
                            </div>
                        `;
                    });
                }

                grid.innerHTML += `
                    <div class="p-2 border-r border-b border-gray-200 min-h-[120px] bg-white hover:bg-slate-50 transition-colors">
                        <div class="flex justify-start mb-1">
                            <span class="text-sm font-bold w-7 h-7 flex items-center justify-center rounded-full ${isToday ? 'bg-indigo-600 text-white shadow-md' : 'text-gray-700'}">${day}</span>
                        </div>
                        <div class="flex flex-col gap-1 overflow-y-auto max-h-[90px] pr-1">
                            ${eventsHtml}
                        </div>
                    </div>
                `;
            }

            const totalCellsRendered = firstDay + daysInMonth;
            const remainingCells = (Math.ceil(totalCellsRendered / 7) * 7) - totalCellsRendered;
            for (let i = 0; i < remainingCells; i++) {
                grid.innerHTML += `<div class="p-2 border-r border-b border-gray-100 bg-gray-50/50 min-h-[120px]"></div>`;
            }
        }
    </script>
</body>
</html>
