<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan Admin - HR System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Pustaka Quill.js untuk Editor Teks ala MS Word -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { primary: '#4F46E5', secondary: '#10B981' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .sidebar-transition { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        /* Styling tambahan untuk Rich Text Editor */
        .quill-editor-container .ql-toolbar {
            border-top-left-radius: 0.5rem;
            border-top-right-radius: 0.5rem;
            border-color: #d1d5db;
            background-color: #f8fafc;
        }
        .quill-editor-container .ql-container {
            border-bottom-left-radius: 0.5rem;
            border-bottom-right-radius: 0.5rem;
            border-color: #d1d5db;
            background-color: #ffffff;
            min-height: 120px;
            font-size: 0.875rem;
        }
        /* Style untuk menampilkan HTML dari editor */
        .quill-content ul { list-style-type: disc !important; padding-left: 1.5rem !important; margin-top: 0.25rem; margin-bottom: 0.5rem; }
        .quill-content ol { list-style-type: decimal !important; padding-left: 1.5rem !important; margin-top: 0.25rem; margin-bottom: 0.5rem; }
        .quill-content p { margin-bottom: 0.25rem; }
        .quill-content strong { font-weight: 700; }
        .quill-content em { font-style: italic; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

    <!-- LAYAR LOGIN -->
    <div id="login-view" class="hidden min-h-screen flex items-center justify-center p-4 bg-slate-900 relative overflow-hidden">
        <div class="absolute inset-0 bg-indigo-900/20"></div>
        <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden relative z-10 border border-slate-100">
            <div class="p-8 pb-6 text-center bg-slate-50 border-b border-slate-100">
                <div class="w-16 h-16 bg-indigo-600 rounded-2xl mx-auto flex items-center justify-center shadow-lg shadow-indigo-500/30 mb-4">
                    <i class="fa-solid fa-gear text-2xl text-white"></i>
                </div>
                <h1 class="text-2xl font-black text-slate-800 tracking-tight">HR Onboarding</h1>
                <p class="text-sm text-slate-500 mt-1 font-medium">Pengaturan Admin</p>
            </div>
            <div class="p-8 pt-6">
                <form id="form-login" onsubmit="handleLogin(event)" class="space-y-5">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wider">Email Akun HR</label>
                        <div class="relative">
                            <i class="fa-solid fa-envelope absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                            <input type="email" id="login-email" required class="w-full text-sm rounded-xl border border-slate-300 pl-11 pr-4 py-3 bg-slate-50/50 outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all font-medium" placeholder="admin@perusahaan.com">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wider">Kata Sandi</label>
                        <div class="relative">
                            <i class="fa-solid fa-lock absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                            <input type="password" id="login-pass" required class="w-full text-sm rounded-xl border border-slate-300 pl-11 pr-4 py-3 bg-slate-50/50 outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all font-medium" placeholder="••••••••">
                        </div>
                    </div>
                    <button type="submit" id="btn-login" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-indigo-500/30 transition-all mt-2 active:scale-[0.98]">
                        Masuk Sistem
                    </button>
                </form>
            </div>
        </div>
    </div>
    <!-- AKHIR LAYAR LOGIN -->

    <!-- APLIKASI UTAMA (Disembunyikan sampai Login) -->
    <div id="app-view" class="hidden min-h-screen w-full">
        <!-- Sidebar / Drawer -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-slate-900 text-white transform -translate-x-full sidebar-transition shadow-2xl flex flex-col">
            <div class="h-16 flex items-center px-6 border-b border-slate-800 gap-3">
                <div class="bg-indigo-500 text-white p-1.5 rounded-lg">
                    <i class="fa-solid fa-users-gear text-sm"></i>
                </div>
                <span class="font-bold text-lg tracking-tight">HR Onboarding</span>
            </div>
            <div class="py-6 px-4 flex-grow flex flex-col gap-2">
                <p class="px-2 text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Menu Utama</p>
                <button onclick="window.location.href='index.html'" id="menu-btn-dashboard" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition-colors">
                    <i class="fa-solid fa-gauge-high w-5 text-center"></i> Monitoring Onboarding
                </button>
                <button onclick="window.location.href='reviewprob.html'" id="menu-btn-calendar" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition-colors">
                    <i class="fa-solid fa-calendar-days w-5 text-center"></i> Tanggal Review
                </button>
                <button onclick="window.location.href='admin.html'" id="menu-btn-admin" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-colors bg-indigo-600 text-white">
                    <i class="fa-solid fa-gear w-5 text-center"></i> Pengaturan Admin
                </button>
            </div>
            <div class="p-4 border-t border-slate-800 text-xs text-slate-500 text-center">
                v2.0 &copy; 2026 HR Dept
            </div>
        </aside>

        <!-- Overlay for sidebar on mobile -->
        <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-30 hidden opacity-0 transition-opacity"></div>

        <!-- Main Content Wrapper -->
        <div class="flex-grow flex flex-col min-h-screen w-full transition-all duration-300">
            
            <!-- Top Navbar -->
            <nav class="bg-white border-b border-gray-200 sticky top-0 z-20 shadow-sm">
                <div class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8">
                    <div class="flex justify-between h-16 items-center">
                        <div class="flex items-center gap-4">
                            <button onclick="toggleSidebar()" class="text-gray-500 hover:text-indigo-600 focus:outline-none p-2 rounded-lg hover:bg-slate-100 transition-colors">
                                <i class="fa-solid fa-bars text-xl"></i>
                            </button>
                            <h1 id="topbar-title" class="font-bold text-lg text-gray-900 hidden sm:block">Pengaturan Admin</h1>
                        </div>
                        <div class="flex items-center gap-4">
                            <button class="text-gray-500 hover:text-gray-700 transition-colors relative mr-2">
                                <i class="fa-solid fa-bell"></i>
                                <span class="absolute -top-1 -right-1 bg-red-500 w-2 h-2 rounded-full"></span>
                            </button>
                            <div class="h-8 w-8 rounded-full bg-indigo-100 flex items-center justify-center border border-indigo-200">
                                <span class="text-indigo-700 font-bold text-sm">HR</span>
                            </div>
                            <!-- Tombol Keluar (Logout) -->
                            <button onclick="handleLogout()" class="flex items-center gap-2 text-xs font-bold text-red-600 bg-red-50 hover:bg-red-100 border border-red-200 px-3 py-1.5 rounded-lg transition-colors shadow-sm ml-2">
                                <i class="fa-solid fa-right-from-bracket"></i> <span class="hidden sm:inline">Keluar</span>
                            </button>
                        </div>
                    </div>
                </div>
            </nav>

            <!-- View: Admin / Pengaturan -->
            <main id="admin-view" class="flex-grow max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full block">
                <div class="mb-6">
                    <h2 class="text-2xl font-bold text-gray-900">Pengaturan Item Onboarding</h2>
                    <p class="text-sm text-gray-500 mt-1">Kelola data master dan pengaturan sistem onboarding.</p>
                </div>

                <div class="flex gap-6 mb-8 border-b border-gray-200">
                    <button onclick="switchAdminTab('template')" id="tab-btn-template" class="pb-3 text-sm font-bold text-indigo-600 border-b-2 border-indigo-600 transition-colors">Item Onboarding</button>
                    <button onclick="switchAdminTab('master')" id="tab-btn-master" class="pb-3 text-sm font-bold text-gray-500 border-b-2 border-transparent hover:text-gray-700 transition-colors">Role, Divisi & Entitas</button>
                </div>

                <div id="admin-tab-template" class="block">
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div class="lg:col-span-1">
                            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 sticky top-24">
                                <h3 id="form-admin-title" class="text-lg font-bold text-gray-800 mb-4 border-b border-gray-100 pb-2">Tambah Item Baru</h3>
                                <form id="form-add-template" onsubmit="saveNewAdminTemplate(event)" class="space-y-4">
                                    <div>
                                        <label class="block text-xs font-bold text-gray-700 mb-1">Nama Item</label>
                                        <input type="text" id="tmpl-label" required class="w-full text-sm rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Contoh: Pembuatan Akun Email">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-bold text-gray-700 mb-1">Instruksi Kerja</label>
                                        <!-- Container untuk Quill Editor -->
                                        <div class="quill-editor-container rounded-lg">
                                            <div id="tmpl-inst-editor"></div>
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-xs font-bold text-gray-700 mb-1">Policy / Kebijakan</label>
                                        <!-- Container untuk Quill Editor -->
                                        <div class="quill-editor-container rounded-lg">
                                            <div id="tmpl-pol-editor"></div>
                                        </div>
                                    </div>
                                    <div class="pt-4 border-t border-gray-100 flex gap-3">
                                        <button type="button" id="btn-cancel-edit" onclick="cancelEditTemplate()" class="hidden w-1/3 px-4 py-2 text-sm font-medium text-gray-700 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">Batal</button>
                                        <button type="submit" id="btn-submit-template" class="w-full px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 flex items-center justify-center gap-2 transition-colors shadow-sm">
                                            <i id="icon-submit-template" class="fa-solid fa-plus"></i> <span id="text-submit-template">Tambah Item</span>
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                        <div class="lg:col-span-2">
                            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
                                <h3 class="text-lg font-bold text-gray-800 mb-4 border-b border-gray-100 pb-2">Daftar Item Onboarding</h3>
                                <div id="admin-template-list" class="space-y-4"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="admin-tab-master" class="hidden">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
                            <h3 class="text-lg font-bold text-gray-800 mb-4 border-b border-gray-100 pb-2">Master Jabatan</h3>
                            <form onsubmit="addMasterRole(event)" class="flex gap-3 mb-4">
                                <input type="text" id="input-master-role" required class="flex-grow text-sm rounded-lg border border-gray-300 px-3 py-2.5 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Posisi baru...">
                                <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 text-sm font-medium transition-colors shadow-sm"><i class="fa-solid fa-plus"></i></button>
                            </form>
                            <div id="list-master-role" class="space-y-2 max-h-[300px] overflow-y-auto pr-2"></div>
                        </div>
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
                            <h3 class="text-lg font-bold text-gray-800 mb-4 border-b border-gray-100 pb-2">Master Divisi</h3>
                            <form onsubmit="addMasterDept(event)" class="flex gap-3 mb-4">
                                <input type="text" id="input-master-dept" required class="flex-grow text-sm rounded-lg border border-gray-300 px-3 py-2.5 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Dept baru...">
                                <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 text-sm font-medium transition-colors shadow-sm"><i class="fa-solid fa-plus"></i></button>
                            </form>
                            <div id="list-master-dept" class="space-y-2 max-h-[300px] overflow-y-auto pr-2"></div>
                        </div>
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
                            <h3 class="text-lg font-bold text-gray-800 mb-4 border-b border-gray-100 pb-2">Master Entitas</h3>
                            <form onsubmit="addMasterEntity(event)" class="flex gap-3 mb-4">
                                <input type="text" id="input-master-entity" required class="flex-grow text-sm rounded-lg border border-gray-300 px-3 py-2.5 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Entitas baru...">
                                <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 text-sm font-medium transition-colors shadow-sm"><i class="fa-solid fa-plus"></i></button>
                            </form>
                            <div id="list-master-entity" class="space-y-2 max-h-[300px] overflow-y-auto pr-2"></div>
                        </div>
                    </div>
                </div>
            </main>

        </div> <!-- End Main Content -->
    </div> <!-- END APLIKASI UTAMA -->

    <!-- Notification Toast -->
    <div id="notification" class="fixed bottom-6 right-6 max-w-sm bg-gray-900 text-white px-4 py-3 rounded-xl shadow-2xl flex items-start gap-3 transform translate-y-20 opacity-0 transition-all duration-300 z-[70] border border-gray-700">
        <i class="fa-solid fa-circle-check text-green-400 mt-1"></i>
        <div>
            <p class="text-sm font-bold text-white">Notifikasi</p>
            <p id="notification-text" class="text-xs text-gray-300 mt-0.5">Pesan</p>
        </div>
    </div>

    <!-- FIREBASE LIBRARIES -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>

    <script>
        // --- KONFIGURASI FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyCobEgxTnMagQj6c8YsfiQtwk6zkvPaq-w",
            authDomain: "hr-onboarding-app-76582.firebaseapp.com",
            projectId: "hr-onboarding-app-76582",
            storageBucket: "hr-onboarding-app-76582.firebasestorage.app",
            messagingSenderId: "594601397871",
            appId: "1:594601397871:web:6af5c22a9c964201d5079a"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        // ----------------------------

        // Referensi Database untuk Master Data
        const masterDataRef = db.collection('settings').doc('masterData');

        // Fungsi Load Master Data dari Firestore
        async function loadMasterData() {
            try {
                const doc = await masterDataRef.get();
                if (doc.exists) {
                    const data = doc.data();
                    if (data.adminChecklistTemplate) adminChecklistTemplate = data.adminChecklistTemplate;
                    if (data.masterRoles) masterRoles = data.masterRoles;
                    if (data.masterDepartments) masterDepartments = data.masterDepartments;
                    if (data.masterEntities) masterEntities = data.masterEntities;
                } else {
                    // Jika belum ada dokumen masterData, simpan data default
                    await saveMasterData();
                }
                renderAdminTemplates(); // Render UI setelah data termuat
            } catch (error) {
                console.error("Error loading master data:", error);
                showNotification("Gagal memuat data pengaturan dari database!");
            }
        }

        // Fungsi Save Master Data ke Firestore
        async function saveMasterData() {
            try {
                await masterDataRef.set({
                    adminChecklistTemplate: adminChecklistTemplate,
                    masterRoles: masterRoles,
                    masterDepartments: masterDepartments,
                    masterEntities: masterEntities
                });
            } catch (error) {
                console.error("Error saving master data:", error);
                showNotification("Gagal menyimpan perubahan ke database!");
            }
        }

        // --- SISTEM LOGIN (AUTHENTICATION) ---
        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('app-view').classList.remove('hidden');
                document.getElementById('app-view').classList.add('flex');
                
                // Render form & data khusus admin
                loadMasterData();
            } else {
                document.getElementById('login-view').classList.remove('hidden');
                document.getElementById('app-view').classList.add('hidden');
                document.getElementById('app-view').classList.remove('flex');
            }
        });

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            const btn = document.getElementById('btn-login');
            
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memeriksa...';
            btn.disabled = true;

            auth.signInWithEmailAndPassword(email, pass)
                .then(() => {
                    btn.innerHTML = 'Masuk Sistem';
                    btn.disabled = false;
                    document.getElementById('form-login').reset();
                    showNotification("Berhasil Login!");
                })
                .catch((error) => {
                    btn.innerHTML = 'Masuk Sistem';
                    btn.disabled = false;
                    alert("Gagal Login! Pastikan Email dan Kata Sandi benar.");
                    console.error(error);
                });
        }

        function handleLogout() {
            auth.signOut().then(() => showNotification("Berhasil Keluar Sistem."));
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }

        function showNotification(msg) {
            const notif = document.getElementById('notification');
            document.getElementById('notification-text').innerText = msg;
            notif.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => notif.classList.add('translate-y-20', 'opacity-0'), 3000);
        }

        // --- SETUP RICH TEXT EDITOR (QUILL.JS) ---
        let instQuill, polQuill;
        document.addEventListener('DOMContentLoaded', () => {
            const quillOptions = {
                theme: 'snow',
                modules: {
                    toolbar: [
                        ['bold', 'italic', 'underline'], 
                        [{ 'color': [] }, { 'background': [] }],
                        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                        ['clean']
                    ]
                },
                placeholder: 'Ketik di sini...'
            };
            instQuill = new Quill('#tmpl-inst-editor', quillOptions);
            polQuill = new Quill('#tmpl-pol-editor', quillOptions);
        });

        // --- DATA MASTER & TEMPLATE DEFAULTS ---
        let adminChecklistTemplate = [
            { 
                id: 'data', 
                label: 'Pengumpulan Data Diri', 
                type: 'admin',
                instructions: "<ul><li>Minta Foto KK (Kirim Ke Nomor Recruitment)</li><li>Minta Karyawan Mengisi Di Data Karyawan</li><li>Pastikan Pengisian Data Karyawan Sesuai Standar HR</li></ul>",
                policies: "<ul><li>Setiap karyawan baru wajib mengisi Data Karyawan di Presensi</li><li>HR memastikan keabsahan data presensi tersebut</li></ul>"
            },
            { 
                id: 'kontrak', 
                label: 'Tanda Tangan Kontrak', 
                type: 'admin', 
                instructions: "<ul><li>Siapkan draf kontrak sesuai posisi</li><li>Jadwalkan sesi tanda tangan dengan karyawan</li></ul>", 
                policies: "<ul><li>Kontrak harus ditandatangani paling lambat hari pertama kerja</li></ul>" 
            }
        ];

        let masterRoles = ["Staff", "Supervisor", "Manager"];
        let masterDepartments = ["Operasional", "Sales Marketing", "Finance", "Engineering", "HR"];
        let masterEntities = ["PT Alpha Jaya", "PT Beta Teknologi", "CV Gamma Sentosa"];
        let editingTemplateIndex = null; 

        // Fungsi Helper untuk jaga-jaga apabila format datanya aslinya Array (Konversi ke HTML)
        const formatToHtml = (content) => {
            if (Array.isArray(content)) {
                return `<ul>` + content.map(i => `<li>${i}</li>`).join('') + `</ul>`;
            }
            return content;
        };

        function switchAdminTab(tab) {
            if(tab === 'template') {
                document.getElementById('admin-tab-template').classList.remove('hidden');
                document.getElementById('admin-tab-master').classList.add('hidden');
                document.getElementById('tab-btn-template').className = "pb-3 text-sm font-bold text-indigo-600 border-b-2 border-indigo-600 transition-colors";
                document.getElementById('tab-btn-master').className = "pb-3 text-sm font-bold text-gray-500 border-b-2 border-transparent hover:text-gray-700 transition-colors";
            } else {
                document.getElementById('admin-tab-template').classList.add('hidden');
                document.getElementById('admin-tab-master').classList.remove('hidden');
                document.getElementById('tab-btn-template').className = "pb-3 text-sm font-bold text-gray-500 border-b-2 border-transparent hover:text-gray-700 transition-colors";
                document.getElementById('tab-btn-master').className = "pb-3 text-sm font-bold text-indigo-600 border-b-2 border-indigo-600 transition-colors";
            }
        }

        // TAMPILKAN LIST ITEM ADMINISTRATIF
        function renderAdminTemplates() {
            renderMasterData(); 
            const listDiv = document.getElementById('admin-template-list');
            listDiv.innerHTML = '';

            adminChecklistTemplate.forEach((tmpl, index) => {
                const instHtml = `<div class="quill-content text-xs text-gray-700">${formatToHtml(tmpl.instructions)}</div>`;
                const polHtml = `<div class="quill-content text-xs text-gray-700">${formatToHtml(tmpl.policies)}</div>`;
                
                listDiv.innerHTML += `
                    <div class="border border-gray-200 rounded-xl p-4 bg-slate-50 relative group">
                        <div class="absolute top-3 right-3 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="editAdminTemplate(${index})" class="text-blue-500 hover:text-blue-700 bg-white border border-blue-100 p-1.5 rounded-md shadow-sm transition-colors" title="Edit Item">
                                <i class="fa-solid fa-pen text-sm"></i>
                            </button>
                            <button onclick="deleteAdminTemplate(${index})" class="text-red-500 hover:text-red-700 bg-white border border-red-100 p-1.5 rounded-md shadow-sm transition-colors" title="Hapus Item">
                                <i class="fa-solid fa-trash-can text-sm"></i>
                            </button>
                        </div>
                        <h4 class="font-bold text-indigo-700 text-base mb-3 pr-16"><i class="fa-solid fa-tag text-xs mr-1 opacity-70"></i> ${tmpl.label}</h4>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <span class="text-[10px] uppercase font-bold text-gray-500 mb-1 block">Instruksi Kerja</span>
                                ${instHtml}
                            </div>
                            <div>
                                <span class="text-[10px] uppercase font-bold text-gray-500 mb-1 block">Policy / Kebijakan</span>
                                ${polHtml}
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // --- SISTEM CRUD UNTUK ITEM ADMINISTRATIF (DENGAN WYSIWYG) ---

        // Masukkan data ke Editor saat tombol Edit ditekan
        function editAdminTemplate(index) {
            editingTemplateIndex = index;
            const tmpl = adminChecklistTemplate[index];
            
            document.getElementById('tmpl-label').value = tmpl.label;
            
            // Masukkan format HTML ke dalam editor Quill
            instQuill.root.innerHTML = formatToHtml(tmpl.instructions);
            polQuill.root.innerHTML = formatToHtml(tmpl.policies);

            document.getElementById('form-admin-title').innerText = "Edit Item Administratif";
            document.getElementById('text-submit-template').innerText = "Simpan Perubahan";
            document.getElementById('icon-submit-template').className = "fa-solid fa-floppy-disk";
            
            document.getElementById('btn-cancel-edit').classList.remove('hidden');
            document.getElementById('btn-submit-template').classList.remove('w-full');
            document.getElementById('btn-submit-template').classList.add('w-2/3');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Batal mengedit dan kosongkan editor
        function cancelEditTemplate() {
            editingTemplateIndex = null;
            document.getElementById('form-add-template').reset();
            instQuill.setContents([]); 
            polQuill.setContents([]);  
            
            document.getElementById('form-admin-title').innerText = "Tambah Item Baru";
            document.getElementById('text-submit-template').innerText = "Tambah Item";
            document.getElementById('icon-submit-template').className = "fa-solid fa-plus";
            
            document.getElementById('btn-cancel-edit').classList.add('hidden');
            document.getElementById('btn-submit-template').classList.remove('w-2/3');
            document.getElementById('btn-submit-template').classList.add('w-full');
        }

        // Simpan Form (Baik Tambah Baru maupun Update)
        async function saveNewAdminTemplate(e) {
            e.preventDefault();
            const label = document.getElementById('tmpl-label').value;
            
            // Ambil konten HTML dari editor teks
            const instHtml = instQuill.root.innerHTML === '<p><br></p>' ? '' : instQuill.root.innerHTML;
            const polHtml = polQuill.root.innerHTML === '<p><br></p>' ? '' : polQuill.root.innerHTML;

            if (!label || !instHtml || !polHtml) {
                showNotification("Mohon lengkapi Form, Instruksi, dan Policy!");
                return;
            }

            if (editingTemplateIndex !== null) {
                // Update Data Lama
                adminChecklistTemplate[editingTemplateIndex].label = label;
                adminChecklistTemplate[editingTemplateIndex].instructions = instHtml; 
                adminChecklistTemplate[editingTemplateIndex].policies = polHtml; 
                showNotification('Item berhasil diperbarui!');
            } else {
                // Tambah Data Baru
                const newItem = {
                    id: 'admin_custom_' + Date.now(),
                    label: label,
                    type: 'admin',
                    instructions: instHtml,
                    policies: polHtml
                };
                adminChecklistTemplate.push(newItem);
                showNotification('Item Administratif berhasil ditambahkan!');
            }

            // Sync ke Firestore
            await saveMasterData();
            
            renderAdminTemplates();
            cancelEditTemplate(); 
        }

        async function deleteAdminTemplate(index) {
            if(confirm("Yakin ingin menghapus item ini?")) {
                adminChecklistTemplate.splice(index, 1);
                
                // Sync ke Firestore
                await saveMasterData();
                
                renderAdminTemplates();
                showNotification('Item berhasil dihapus.');
            }
        }

        // --- SISTEM CRUD UNTUK MASTER DATA ---
        function renderMasterData() {
            const roleList = document.getElementById('list-master-role');
            const deptList = document.getElementById('list-master-dept');
            const entityList = document.getElementById('list-master-entity');
            
            if(roleList) {
                roleList.innerHTML = masterRoles.map((role, i) => `
                    <div class="flex justify-between items-center bg-slate-50 border border-gray-200 px-3 py-2 rounded-lg text-sm group transition-colors hover:bg-indigo-50">
                        <span class="font-medium text-gray-700">${role}</span>
                        <button type="button" onclick="deleteMasterRole(${i})" class="text-gray-400 hover:text-red-600 opacity-0 group-hover:opacity-100 transition-opacity"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                `).join('');
            }

            if(deptList) {
                deptList.innerHTML = masterDepartments.map((dept, i) => `
                    <div class="flex justify-between items-center bg-slate-50 border border-gray-200 px-3 py-2 rounded-lg text-sm group transition-colors hover:bg-indigo-50">
                        <span class="font-medium text-gray-700">${dept}</span>
                        <button type="button" onclick="deleteMasterDept(${i})" class="text-gray-400 hover:text-red-600 opacity-0 group-hover:opacity-100 transition-opacity"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                `).join('');
            }

            if(entityList) {
                entityList.innerHTML = masterEntities.map((ent, i) => `
                    <div class="flex justify-between items-center bg-slate-50 border border-gray-200 px-3 py-2 rounded-lg text-sm group transition-colors hover:bg-indigo-50">
                        <span class="font-medium text-gray-700">${ent}</span>
                        <button type="button" onclick="deleteMasterEntity(${i})" class="text-gray-400 hover:text-red-600 opacity-0 group-hover:opacity-100 transition-opacity"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                `).join('');
            }
        }

        async function addMasterRole(e) {
            e.preventDefault();
            const input = document.getElementById('input-master-role');
            const val = input.value.trim();
            if (val && !masterRoles.includes(val)) {
                masterRoles.push(val);
                await saveMasterData(); // Sync ke Firestore
                input.value = '';
                renderMasterData();
                showNotification("Posisi baru berhasil ditambahkan.");
            }
        }
        async function deleteMasterRole(index) { 
            masterRoles.splice(index, 1); 
            await saveMasterData(); // Sync ke Firestore
            renderMasterData(); 
        }

        async function addMasterDept(e) {
            e.preventDefault();
            const input = document.getElementById('input-master-dept');
            const val = input.value.trim();
            if (val && !masterDepartments.includes(val)) {
                masterDepartments.push(val);
                await saveMasterData(); // Sync ke Firestore
                input.value = '';
                renderMasterData();
                showNotification("Departemen baru berhasil ditambahkan.");
            }
        }
        async function deleteMasterDept(index) { 
            masterDepartments.splice(index, 1); 
            await saveMasterData(); // Sync ke Firestore
            renderMasterData(); 
        }

        async function addMasterEntity(e) {
            e.preventDefault();
            const input = document.getElementById('input-master-entity');
            const val = input.value.trim();
            if (val && !masterEntities.includes(val)) {
                masterEntities.push(val);
                await saveMasterData(); // Sync ke Firestore
                input.value = '';
                renderMasterData();
                showNotification("Entitas baru berhasil ditambahkan.");
            }
        }
        async function deleteMasterEntity(index) { 
            masterEntities.splice(index, 1); 
            await saveMasterData(); // Sync ke Firestore
            renderMasterData(); 
        }
    </script>
</body>
</html>
